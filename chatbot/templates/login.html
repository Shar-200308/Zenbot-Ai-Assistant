<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | ZenBot</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
        <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
</head>
<body>

<div class="login-wrapper">

    <!-- LEFT SECTION -->
    <div class="login-left">
        <h1>WELCOME TO THE ZENSAR COMPANY CHATBOT WITH RESUME ANALYSIS</h1>

        <img src="{% static 'assets/ZenSar.png' %}" alt="Rocket">
    </div>

    <!-- RIGHT SECTION -->
    <div class="login-right">
        <h2>User Login</h2>

        <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="email" id="email" placeholder="Email">
        </div>

        <div class="input-group">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
            <i class="fa fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>

        <div style="display:flex; justify-content:flex-end; margin:-6px 0 14px 0;">
            <a href="javascript:void(0)" onclick="forgotPassword()" style="font-size:13px; color:#58a6ff; text-decoration:none; transition:color 0.2s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Forgot Password?</a>
        </div>

        <button onclick="login()">Login</button>

        <p class="signup">
            Don’t have an account?
            <a href="/signup/">Sign Up</a>
        </p>

        <p id="msg"></p>
    </div>

</div>

<script type="module" src="{% static 'js/auth.js' %}"></script>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (pass.type === "password") {
        pass.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        pass.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}
</script>
<style>
/* Sleek Solid Dark Mode Aesthetic */
/* Outfit self-hosted via static/fonts/outfit.css */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
}

body {
    background-color: #0d1117;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #c9d1d9;
}

/* MAIN WRAPPER */
.login-wrapper {
    width: 900px;
    height: 520px;
    display: flex;
    background-color: #161b22;
    border-radius: 12px;
    border: 1px solid #30363d;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    overflow: hidden;
}

/* LEFT SIDE */
.login-left {
    width: 50%;
    padding: 50px 40px;
    background-color: #0d1117;
    border-right: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.login-left h1 {
    font-size: 26px;
    font-weight: 700;
    color: #e6edf3;
    margin-bottom: 20px;
    line-height: 1.3;
}

.login-left p {
    font-size: 15px;
    color: #8b949e;
    line-height: 1.6;
}

.login-left img {
    width: 80%;
    max-width: 300px;
    margin-top: 30px;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
}

/* RIGHT SIDE */
.login-right {
    width: 50%;
    padding: 50px 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: #161b22;
}

.login-right h2 {
    text-align: center;
    margin-bottom: 35px;
    font-size: 28px;
    font-weight: 600;
    color: #c9d1d9;
}

/* INPUTS */
.input-group {
    position: relative;
    margin-bottom: 22px;
}

.input-group input {
    width: 100%;
    padding: 14px 45px;
    background-color: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
}

.input-group input::placeholder {
    color: #8b949e;
}

.input-group input:focus {
    border-color: #58a6ff;
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
    background-color: #0d1117;
}

.input-group i {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #8b949e;
    font-size: 16px;
}

.input-group .fa-user,
.input-group .fa-lock {
    left: 14px;
}

.input-group input:focus ~ i:not(.toggle-password),
.input-group input:focus + i:not(.toggle-password) {
    color: #58a6ff;
}

.toggle-password {
    right: 14px;
    cursor: pointer;
    transition: color 0.2s;
}

.toggle-password:hover {
    color: #c9d1d9;
}

/* OPTIONS */
.options {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 25px;
    color: #8b949e;
}

.options a {
    color: #58a6ff;
    text-decoration: none;
}

/* BUTTON */
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 1px solid rgba(240, 246, 252, 0.1);
    border-radius: 6px;
    background-color: #238636;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
}

button:hover {
    background-color: #2ea043;
    border-color: rgba(240, 246, 252, 0.1);
}

button:active {
    background-color: #238636;
}

/* SIGNUP */
.signup {
    margin-top: 25px;
    text-align: center;
    font-size: 14px;
    color: #8b949e;
}

.signup a {
    color: #58a6ff;
    text-decoration: none;
    font-weight: 500;
    margin-left: 4px;
}

.signup a:hover {
    text-decoration: underline;
}

#msg {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    color: #f85149;
    font-weight: 500;
    min-height: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .login-wrapper {
        flex-direction: column;
        height: auto;
        width: 95%;
        margin: 20px 0;
    }
    
    .login-left,
    .login-right {
        width: 100%;
        padding: 30px 20px;
    }
    
    .login-left {
        border-right: none;
        border-bottom: 1px solid #30363d;
    }

    .login-left h1 {
        font-size: 20px;
    }

    .login-left img {
        display: none;
    }

    .login-right h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    .input-group input {
        padding: 12px 40px;
        font-size: 14px;
    }
}
</style>
</body>
</html>
